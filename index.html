/* ============================= MULTI-PAGE "FAMILY BY FAMILY" PDF ============================= */
function getFamilyUnitsForSubset(subset){
  // same logic as getFamilyUnits(), but scoped to a given subset of people (used to split an
  // oversized descendant/ancestor/full-tree PDF into per-family pages while keeping context).
  const ids = Object.keys(subset);
  const parent = {};
  ids.forEach(id=>parent[id]=id);
  function find(x){ while(parent[x]!==x) x=parent[x]; return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
  Object.values(subset).forEach(p=>{
    (p.spouseIds||[]).forEach(sid=>{ if(subset[sid]) union(p.id, sid); });
    (p.exSpouseIds||[]).forEach(sid=>{ if(subset[sid]) union(p.id, sid); });
  });
  Object.values(subset).forEach(child=>{
    const parents = [...new Set([...(child.parentIds||[]), ...(child.adoptiveParentIds||[])])].filter(id=>subset[id]);
    for(let i=1;i<parents.length;i++) union(parents[0], parents[i]);
  });
  const clusters = {};
  ids.forEach(id=>{ const r=find(id); (clusters[r]=clusters[r]||[]).push(id); });
  const units = [];
  Object.values(clusters).forEach(members=>{
    const children = Object.values(subset).filter(child=>{
      const parents = [...(child.parentIds||[]), ...(child.adoptiveParentIds||[])];
      return parents.some(pid=>members.includes(pid));
    }).map(c=>c.id);
    if(children.length===0) return;
    units.push({ parentIds: members.slice(), children });
  });
  return units;
}
function sortFamilyUnitsByGeneration(units, gen){
  units.sort((a,b)=>{
    const ga = Math.min(...a.parentIds.map(id=> gen[id]!==undefined ? gen[id] : 0));
    const gb = Math.min(...b.parentIds.map(id=> gen[id]!==undefined ? gen[id] : 0));
    if(ga!==gb) return ga-gb;
    const na = a.parentIds.map(id=>people[id]?.name||'').sort().join();
    const nb = b.parentIds.map(id=>people[id]?.name||'').sort().join();
    return na.localeCompare(nb);
  });
  return units;
}
function getFamilyUnits(){
  return getFamilyUnitsForSubset(people);
}
function getSortedFamilyUnits(){
  return sortFamilyUnitsByGeneration(getFamilyUnits(), computeGenerations());
}

// Generic multi-page "one family per page" PDF renderer, shared by the full "PDF por famílias"
// export and by the automatic split used when a single descendant/ancestor tree is too large
// to fit safely on one page.
async function renderFamilyUnitsToPdf(units, opts){
  opts = opts || {};
  const pageSize = (opts.pageSize || 'a4').toLowerCase();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format: PAGE_SIZES[pageSize] ? pageSize : 'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 40;

  pdf.setFillColor(250,246,236);
  pdf.rect(0,0,pageW,pageH,'F');
  pdf.setTextColor(138,111,59);
  pdf.setFontSize(11);
  pdf.text('LIVRO DE FAMÍLIA', pageW/2, pageH/2-46, {align:'center'});
  pdf.setTextColor(36,31,20);
  pdf.setFontSize(24);
  const coverLines = pdf.splitTextToSize(opts.coverTitle || 'Árvore Genealógica', pageW-160);
  pdf.text(coverLines, pageW/2, pageH/2-14, {align:'center'});
  pdf.setFontSize(11);
  pdf.setTextColor(107,96,71);
  pdf.text(opts.coverSubtitle || `${units.length} famílias · gerado em ${new Date().toLocaleDateString('pt-BR')}`, pageW/2, pageH/2+18, {align:'center'});

  let successCount = 0;
  const failed = [];

  for(let i=0;i<units.length;i++){
    const unit = units[i];
    let wrapper;
    const parentNames = unit.parentIds.map(id=>people[id]?.name).filter(Boolean).join(' & ') || '(desconhecido)';
    try{
      const included = new Set();
      unit.parentIds.forEach(id=>{
        included.add(id);
        const p = people[id]; if(!p) return;
        (p.spouseIds||[]).concat(p.exSpouseIds||[]).forEach(sid=>{ if(people[sid]) included.add(sid); });
      });
      unit.children.forEach(id=> included.add(id));
      const subset = {}; included.forEach(id=> subset[id]=people[id]);
      const titleText = `Família de ${parentNames}`;

      showToast(`Gerando parte ${i+1} de ${units.length}…`);
      wrapper = renderTreeSnapshot(subset, titleText, new Set());
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      await waitForImages(wrapper);
      const scale = safeCanvasScale(wrapper.scrollWidth, wrapper.scrollHeight, 2);
      const canvas = await html2canvas(wrapper, {
        backgroundColor:'#faf6ec', scale, useCORS:true,
        width: wrapper.scrollWidth, height: wrapper.scrollHeight,
        windowWidth: wrapper.scrollWidth, windowHeight: wrapper.scrollHeight
      });
      const imgW = canvas.width/scale, imgH = canvas.height/scale;
      const availW = pageW - margin*2, availH = pageH - margin*2 - (opts.headerNote ? 16 : 0);
      const fitScale = Math.min(availW/imgW, availH/imgH, 1.4);
      const drawW = imgW*fitScale, drawH = imgH*fitScale;
      const x = (pageW-drawW)/2, y = (pageH-drawH)/2 + (opts.headerNote ? 10 : 0);
      pdf.addPage(PAGE_SIZES[pageSize] ? pageSize : 'a4','landscape');
      pdf.setFillColor(250,246,236);
      pdf.rect(0,0,pageW,pageH,'F');
      if(opts.headerNote){
        pdf.setFontSize(9);
        pdf.setTextColor(138,111,59);
        pdf.text(opts.headerNote, margin, 22);
      }
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, drawW, drawH);
      pdf.setFontSize(9);
      pdf.setTextColor(150,140,110);
      pdf.text(`Parte ${i+1} de ${units.length} — ${parentNames}`, margin, pageH-16);
      successCount++;
    }catch(err){
      console.error('Erro ao gerar página', parentNames, err);
      failed.push(parentNames);
    }finally{
      if(wrapper && wrapper.parentNode) document.body.removeChild(wrapper);
    }
  }

  if(successCount===0){
    showToast('Não foi possível gerar nenhuma página. Tente selecionar menos famílias por vez.');
    return { successCount, failed };
  }
  pdf.save(opts.filename || 'arvore-genealogica.pdf');
  showToast(failed.length
    ? `PDF salvo com ${successCount} partes (${failed.length} não puderam ser geradas: ${failed.slice(0,3).join(', ')}${failed.length>3?'…':''}).`
    : `PDF salvo com sucesso — ${successCount} parte(s).`);
  return { successCount, failed };
}

async function generateFamilyByFamilyPdf(customUnits){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    showToast('Bibliotecas de PDF não carregaram. Verifique sua conexão.'); return;
  }
  const units = (customUnits && customUnits.length) ? customUnits : getSortedFamilyUnits();
  if(!units.length){ showToast('Nenhuma família com filhos encontrada para gerar o relatório.'); return; }
  await renderFamilyUnitsToPdf(units, {
    pageSize: 'a4',
    coverTitle: 'Árvore Genealógica — Relatório por Famílias',
    coverSubtitle: `${units.length} famílias selecionadas · gerado em ${new Date().toLocaleDateString('pt-BR')}`,
    filename: 'arvore-genealogica-por-familias.pdf'
  });
}

function openFamilySelectionModal(title, actionLabel, onAction){
  const units = getSortedFamilyUnits();
  if(!units.length){ showToast('Nenhuma família com filhos encontrada.'); return; }
  const label = u => {
    const parentNames = u.parentIds.map(id=>people[id]?.name).filter(Boolean).join(' & ') || '(desconhecido)';
    const childNames = u.children.map(id=>people[id]?.name).filter(Boolean).join(', ');
    return { parentNames, childNames };
  };

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.width = '560px';
  modal.innerHTML = `
    <div class="modal-head">${escapeHtml(title)}</div>
    <div class="modal-body">
      <div class="field"><label>Buscar por nome do pai/mãe ou filho(a)</label>
        <input type="text" id="fam-search" placeholder="Ex: nome de 1 pai e 1 filho…">
      </div>
      <div class="field-row">
        <div class="field"><label>Intervalo — família nº</label><input type="number" id="fam-range-from" min="1" max="${units.length}" value="1"></div>
        <div class="field"><label>até nº</label><input type="number" id="fam-range-to" min="1" max="${units.length}" value="${units.length}"></div>
      </div>
      <button class="add-link" id="fam-apply-range">Aplicar intervalo à seleção</button>
      <div class="field-row" style="margin-top:10px;">
        <button class="btn" id="fam-select-all" style="flex:1;">Selecionar todas</button>
        <button class="btn" id="fam-select-none" style="flex:1;">Limpar seleção</button>
      </div>
      <div class="section-title">Famílias (<span id="fam-count-selected">${units.length}</span> de ${units.length} selecionadas)</div>
      <div id="fam-list" style="max-height:280px;overflow-y:auto;">
        ${units.map((u,i)=>{ const {parentNames,childNames} = label(u); return `
          <label class="family-option" data-search="${escapeAttr(normalize(parentNames+' '+childNames))}" style="cursor:pointer;">
            <span style="display:flex;gap:9px;align-items:flex-start;">
              <input type="checkbox" class="fam-checkbox" data-idx="${i}" checked style="margin-top:3px;">
              <span><strong>${i+1}. ${escapeHtml(parentNames)}</strong><br><small style="color:var(--muted);">${escapeHtml(childNames)}</small></span>
            </span>
          </label>`; }).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="fam-cancel">Cancelar</button>
      <button class="btn primary" id="fam-generate">${escapeHtml(actionLabel)}</button>
    </div>
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  function updateCount(){
    const n = overlay.querySelectorAll('.fam-checkbox:checked').length;
    document.getElementById('fam-count-selected').textContent = n;
  }
  overlay.querySelectorAll('.fam-checkbox').forEach(cb=> cb.addEventListener('change', updateCount));

  document.getElementById('fam-search').addEventListener('input', e=>{
    const q = normalize(e.target.value);
    overlay.querySelectorAll('#fam-list .family-option').forEach(el=>{
      el.style.display = (!q || el.dataset.search.includes(q)) ? 'flex' : 'none';
    });
  });
  document.getElementById('fam-apply-range').onclick = ()=>{
    const from = Math.max(1, parseInt(document.getElementById('fam-range-from').value,10)||1);
    const to = Math.min(units.length, parseInt(document.getElementById('fam-range-to').value,10)||units.length);
    overlay.querySelectorAll('.fam-checkbox').forEach(cb=>{
      const idx = Number(cb.dataset.idx);
      cb.checked = (idx+1>=from && idx+1<=to);
    });
    updateCount();
    showToast(`Intervalo aplicado: famílias ${from} a ${to}.`);
  };
  document.getElementById('fam-select-all').onclick = ()=>{ overlay.querySelectorAll('.fam-checkbox').forEach(cb=>cb.checked=true); updateCount(); };
  document.getElementById('fam-select-none').onclick = ()=>{ overlay.querySelectorAll('.fam-checkbox').forEach(cb=>cb.checked=false); updateCount(); };
  document.getElementById('fam-cancel').onclick = ()=>document.body.removeChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) document.body.removeChild(overlay); });
  document.getElementById('fam-generate').onclick = ()=>{
    const selected = Array.from(overlay.querySelectorAll('.fam-checkbox:checked')).map(cb=>units[Number(cb.dataset.idx)]);
    if(!selected.length){ showToast('Selecione ao menos uma família.'); return; }
    document.body.removeChild(overlay);
    onAction(selected);
  };
}

function exportFamiliesAsJson(units){
  const seenIds = new Set();
  const familias = units.map((unit, i)=>{
    const pais = unit.parentIds.map(id=>people[id]).filter(Boolean);
    const filhos = unit.children.map(id=>people[id]).filter(Boolean);
    pais.concat(filhos).forEach(p=>seenIds.add(p.id));
    const parentNames = pais.map(p=>p.name).filter(Boolean).join(' & ') || '(desconhecido)';
    return {
      familia: i+1,
      nome: `Família de ${parentNames}`,
      pais,
      filhos
    };
  });
  const output = {
    geradoEm: new Date().toISOString(),
    totalFamilias: familias.length,
    totalPessoas: seenIds.size,
    familias
  };
  const blob = new Blob([JSON.stringify(output, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = units.length===1
    ? `familia-${(units[0].parentIds.map(id=>people[id]?.name).filter(Boolean).join('-')||'selecionada')}.json`.toLowerCase().replace(/[^a-z0-9.-]+/g,'-')
    : 'familias-selecionadas.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(`JSON exportado com ${familias.length} família(s) e ${seenIds.size} pessoa(s).`);
}


/* ============================= EXCEL EXPORT ============================= */
function exportExcel(){
  if(typeof XLSX==='undefined'){ showToast('Biblioteca de Excel não carregou. Verifique sua conexão.'); return; }
  if(Object.keys(people).length===0){ showToast('Nada para exportar.'); return; }
  const { gen, genList, clustersMap, clusterOrderIndex } = layoutTree(people);

  // Sheet 1: tree view, one column per generation, one row per couple/individual slot
  const maxRows = Math.max(...genList.map(g=>{
    const roots = Object.entries(clusterOrderIndex).filter(([root])=>clustersMap[root] && gen[clustersMap[root][0]]===g);
    return roots.length;
  }));
  const header = genList.map(g=>'Geração '+(g+1));
  const grid = Array.from({length:maxRows}, ()=> new Array(genList.length).fill(''));
  genList.forEach((g, colIdx)=>{
    Object.entries(clustersMap).forEach(([root, members])=>{
      if(gen[members[0]] !== g) return;
      const rowIdx = clusterOrderIndex[root];
      const label = members.map(id=>{
        const person = people[id];
        const dates = fullDates(person);
        return person.name + (dates?` (${dates})`:'');
      }).join(' & ');
      if(rowIdx < maxRows) grid[rowIdx][colIdx] = label;
    });
  });
  const treeSheetData = [header, ...grid];
  const wsTree = XLSX.utils.aoa_to_sheet(treeSheetData);
  wsTree['!cols'] = genList.map(()=>({wch: 34}));

  // Sheet 2: flat detailed data
  const nameOf = id => (people[id]||{}).name || '';
  const rows = Object.values(people).map(p=>({
    'Nome': p.name || '',
    'Gênero': p.gender==='male'?'Masculino':p.gender==='female'?'Feminino':'Outro',
    'Geração': (gen[p.id]!==undefined ? gen[p.id]+1 : ''),
    'Nascimento': p.birth || '',
    'Falecimento': p.death || '',
    'Pais (biológicos)': (p.parentIds||[]).map(nameOf).join(', '),
    'Pais adotivos': (p.adoptiveParentIds||[]).map(nameOf).join(', '),
    'Cônjuge(s)': (p.spouseIds||[]).map(nameOf).join(', '),
    'Ex-cônjuge(s)': (p.exSpouseIds||[]).map(nameOf).join(', '),
    'Filhos(as)': Object.values(people).filter(x=>(x.parentIds||[]).includes(p.id)).map(x=>x.name).join(', '),
    'Filhos(as) adotivos': Object.values(people).filter(x=>(x.adoptiveParentIds||[]).includes(p.id)).map(x=>x.name).join(', '),
    'Notas': p.notes || ''
  }));
  const wsData = XLSX.utils.json_to_sheet(rows);
  wsData['!cols'] = [ {wch:26},{wch:12},{wch:9},{wch:12},{wch:13},{wch:26},{wch:22},{wch:22},{wch:22},{wch:26},{wch:22},{wch:30} ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsTree, 'Árvore');
  XLSX.utils.book_append_sheet(wb, wsData, 'Dados');
  XLSX.writeFile(wb, 'arvore-genealogica.xlsx');
  showToast('Excel exportado com sucesso.');
}
document.getElementById('btn-export-excel').onclick = exportExcel;

  let first=null;
  Object.values(people).forEach(p=>{
    if(normalize(p.name).includes(q)){
      const el = document.querySelector(`.person-card[data-id="${p.id}"]`);
      if(el){ el.classList.add('match'); if(!first) first=p.id; }
    }
  });
  if(first){
    const fp = overrides[first] || lastLayout.pos[first];
    if(fp){
      const wrap = document.getElementById('canvas-wrap');
      const rect = wrap.getBoundingClientRect();
      tx = rect.width/2 - (fp.x+CARD_W/2)*scale;
      ty = rect.height/2 - (fp.y+CARD_H/2)*scale;
      applyTransform();
    }
  }
});
