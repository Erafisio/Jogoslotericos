<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árvore Genealógica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#14161f;
  --ink-2:#1c2030;
  --ink-3:#252a3d;
  --paper:#efe7d3;
  --paper-2:#e4d9bb;
  --paper-ink:#2a2313;
  --brass:#c69b4a;
  --brass-dim:#8a6f3b;
  --teal:#3e6e64;
  --rust:#a15a3d;
  --muted:#8f8a7a;
  --danger:#b3543f;
  --line:#39404f;
  --fg:#efe7d3;
  --card-c1:var(--paper);
  --card-c2:var(--paper-2);
  --card-text:var(--paper-ink);
  --card-text-dim:#6b6047;
  --name-font-size:14.5px;
}
body.theme-light{
  --ink:#f4efe1;
  --ink-2:#eae2c9;
  --ink-3:#ded2ac;
  --line:#c7b98e;
  --muted:#7c7052;
  --brass:#9c7530;
  --brass-dim:#7a5d29;
  --danger:#a3432f;
  --fg:#2a2313;
}
body.theme-light #canvas-wrap{background:linear-gradient(var(--ink) 0%, #e7dcbc90 100%);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--fg);font-family:'Inter',sans-serif;overflow:hidden;transition:background .2s,color .2s;}
#app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;}

/* subtle ledger texture */
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(198,155,74,0.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(62,110,100,0.07), transparent 40%);
}

header{
  position:relative;z-index:5;
  display:flex;align-items:center;gap:16px;
  padding:14px 20px;
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:8px;}
.brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);}
.brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0;color:var(--fg);}
.stats{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}

.spacer{flex:1;}

.search-wrap{position:relative;}
.search-wrap input{
  background:var(--ink-3);border:1px solid var(--line);color:var(--fg);
  padding:8px 12px 8px 30px;border-radius:7px;font-size:13px;width:200px;font-family:'Inter';
  outline:none;transition:border-color .15s, width .15s;
}
.search-wrap input:focus{border-color:var(--brass);width:240px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;width:14px;height:14px;}

button.btn{
  font-family:'Inter';font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--ink-3);color:var(--fg);
  padding:8px 13px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
button.btn:hover{border-color:var(--brass);color:var(--brass);}
button.btn.primary{background:var(--brass);border-color:var(--brass);color:#1c1608;}
button.btn.primary:hover{background:#d8ab5c;color:#1c1608;}
button.btn.danger{border-color:var(--danger);color:var(--danger);}
button.btn.danger:hover{background:var(--danger);color:#fff;}
button.icon-btn{
  background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:5px;
}
button.icon-btn:hover{color:var(--fg);background:var(--ink-3);}

.legend{display:flex;gap:10px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

#canvas-wrap{
  position:relative;flex:1;overflow:hidden;cursor:grab;z-index:1;
  background:
    linear-gradient(var(--ink) 0%, #17192290 100%);
}
#canvas-wrap.grabbing{cursor:grabbing;}
#viewport{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
#links-svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
#nodes-layer{position:absolute;top:0;left:0;}

.person-card{
  position:absolute;width:190px;min-height:82px;
  background:linear-gradient(180deg, var(--card-c1), var(--card-c2));
  border-radius:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 6px 14px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.15);
  padding:10px 12px 9px;
  cursor:pointer;user-select:none;
  transition:transform .12s, box-shadow .12s;
}
.person-card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 10px 20px rgba(0,0,0,.45), 0 0 0 1px var(--brass);}
.person-card.selected{box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 10px 20px rgba(0,0,0,.45), 0 0 0 2px var(--brass);}
.person-card.match{box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 0 0 3px var(--brass), 0 0 24px rgba(198,155,74,.6);}
.person-card .bar{position:absolute;top:0;left:8px;right:8px;height:3px;border-radius:0 0 3px 3px;}
.person-card .name{font-family:'Fraunces',serif;font-weight:600;font-size:var(--name-font-size,14.5px);color:var(--name-color,var(--card-text));line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.person-card .dates{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--card-text-dim);margin-top:4px;letter-spacing:.02em;}
.person-card .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8a7c55;margin-top:3px;text-transform:uppercase;letter-spacing:.06em;display:inline-block;margin-right:6px;}
.person-card .tag.adoptive{color:#2f5850;}
.person-card .avatar{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--ink-2);box-shadow:0 2px 6px rgba(0,0,0,.4);background:#fff;}
.avatar-lg{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:block;background:var(--ink-3);}
.avatar-placeholder{width:84px;height:84px;border-radius:50%;background:var(--ink-3);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;}
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photo-actions{display:flex;flex-direction:column;gap:6px;}
.popover input[type=range]{width:100%;accent-color:var(--brass);}
.popover .range-value{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);text-align:center;margin-top:4px;}

/* drawer */
#drawer{
  position:fixed;top:0;right:0;height:100vh;width:360px;max-width:92vw;
  background:var(--ink-2);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;
  z-index:20;display:flex;flex-direction:column;
}
#drawer.open{transform:translateX(0);}
#drawer .drawer-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
#drawer .drawer-head .gender-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
#drawer .drawer-head h2{font-family:'Fraunces',serif;font-size:17px;margin:0;flex:1;font-weight:600;}
#drawer .drawer-body{padding:16px 18px;overflow-y:auto;flex:1;}
#drawer .drawer-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}

.field{margin-bottom:14px;}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin-bottom:5px;}
.field input[type=text], .field select, .field textarea{
  width:100%;background:var(--ink-3);border:1px solid var(--line);color:var(--fg);
  padding:8px 10px;border-radius:6px;font-size:13.5px;font-family:'Inter';outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass);}
.field textarea{resize:vertical;min-height:50px;font-family:'Inter';}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;}

.section-title{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line);}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--ink-3);border:1px solid var(--line);
  padding:5px 9px 5px 10px;border-radius:20px;font-size:12px;
}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0;}
.chip button:hover{color:var(--danger);}
.chip.dashed{border-style:dashed;opacity:.75;}
.add-link{font-size:12px;color:var(--brass);background:none;border:1px dashed var(--brass-dim);padding:6px 10px;border-radius:6px;cursor:pointer;width:100%;text-align:left;font-family:'Inter';}
.add-link:hover{background:rgba(198,155,74,.08);}
.empty-hint{font-size:12px;color:var(--muted);font-style:italic;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,14,.6);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:center;justify-content:center;}
.modal{width:400px;max-width:92vw;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:82vh;display:flex;flex-direction:column;}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.modal-body{padding:16px 18px;overflow-y:auto;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.person-option{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;}
.person-option:hover{background:var(--ink-3);}
.person-option small{color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.divider-text{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--muted);text-align:center;margin:14px 0 10px;letter-spacing:.08em;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 4px;color:var(--fg);}
.checkbox-row input{width:16px;height:16px;accent-color:var(--brass);}
.family-option{padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;}
.family-option:hover{background:var(--ink-3);border-color:var(--line);}
.family-option small{color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.family-option.all{border:1px dashed var(--brass-dim);margin-bottom:10px;}
.progress-line{font-size:12px;color:var(--muted);text-align:center;padding:10px 0;font-family:'IBM Plex Mono',monospace;}

.popover{position:absolute;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:14px;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.5);width:220px;}
.popover .swatches{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.popover .swatch{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;}
.popover .swatch.active{border-color:var(--fg);}
.popover input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--ink-3);cursor:pointer;padding:2px;}
.popover .pop-title{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin-bottom:6px;}

table.report-table{width:100%;border-collapse:collapse;font-size:13px;}
table.report-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink-2);}
table.report-table td{padding:7px 10px;border-bottom:1px solid var(--ink-3);color:var(--fg);}
table.report-table .rp-edit{background:var(--ink-3);border:1px solid var(--brass-dim);color:var(--fg);border-radius:5px;padding:3px 6px;font-size:12.5px;font-family:'Inter';}
table.report-table.editing tr[data-row-id]{background:rgba(198,155,74,0.05);}
table.report-table tr:hover td{background:var(--ink-3);}
.gen-pill{display:inline-block;background:var(--ink-3);border:1px solid var(--brass-dim);color:var(--brass);border-radius:20px;padding:2px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;}

.gen-nav-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:7px;cursor:pointer;margin-bottom:6px;border:1px solid var(--line);}
.gen-nav-item:hover{border-color:var(--brass);}
.gen-nav-item .n{font-family:'Fraunces',serif;font-weight:600;font-size:14px;}
.gen-nav-item small{color:var(--muted);font-family:'IBM Plex Mono',monospace;}

.person-card.dimmed{opacity:.22;}

.help-topic{margin-bottom:20px;}
.help-topic h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--brass);margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.help-topic p{font-size:13px;color:var(--fg);opacity:.85;margin:0 0 6px;line-height:1.55;}
.help-topic ul{margin:2px 0 0 18px;padding:0;font-size:13px;color:var(--fg);opacity:.85;line-height:1.65;}
.help-topic ul li{margin-bottom:3px;}
.help-topic ul li strong{color:var(--fg);opacity:1;}
.help-toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.help-toc a{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--brass);background:var(--ink-3);border:1px solid var(--line);border-radius:20px;padding:4px 10px;text-decoration:none;cursor:pointer;}
.help-toc a:hover{border-color:var(--brass);}

.shared-banner{display:none;padding:7px 20px;background:#3e6e64;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.02em;align-items:center;gap:8px;position:relative;z-index:6;}
.shared-banner.show{display:flex;}
.shared-banner button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:3px 9px;font-size:10.5px;cursor:pointer;margin-left:auto;}
.shared-banner button:hover{background:rgba(255,255,255,.28);}

.zoom-controls{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:5;}
.zoom-controls button{width:34px;height:34px;border-radius:8px;background:var(--ink-3);border:1px solid var(--line);color:var(--fg);font-size:16px;cursor:pointer;}
.zoom-controls button:hover{border-color:var(--brass);color:var(--brass);}

#minimap{
  position:absolute;bottom:18px;left:18px;z-index:5;
  width:190px;height:130px;background:rgba(20,22,31,.72);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  backdrop-filter:blur(3px);
}
body.theme-light #minimap{background:rgba(244,239,225,.82);}
#minimap svg{width:100%;height:100%;display:block;cursor:crosshair;}
#minimap .mm-node{fill-opacity:.85;}
#minimap .mm-viewport{fill:rgba(198,155,74,0.14);stroke:#c69b4a;stroke-width:1.5;cursor:grab;}

#exit-presentation{
  display:none;position:absolute;top:16px;right:16px;z-index:20;
  background:var(--ink-3);border:1px solid var(--line);color:var(--fg);
  padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;font-family:'Inter';
}
#exit-presentation:hover{border-color:var(--brass);color:var(--brass);}
body.presentation-mode header{display:none;}
body.presentation-mode .shared-banner{display:none;}
body.presentation-mode #exit-presentation{display:block;}
body.presentation-mode #canvas-wrap{height:100vh;}

.gen-label{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim);
  border-left:2px solid var(--brass-dim);padding-left:8px;}

.toast{position:fixed;bottom:18px;left:18px;background:var(--ink-3);border:1px solid var(--brass);color:var(--fg);
  padding:9px 14px;border-radius:7px;font-size:12.5px;z-index:60;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;font-family:'IBM Plex Mono',monospace;}
.toast.show{opacity:1;transform:translateY(0);}

#file-input{display:none;}

@media (max-width:640px){
  header{gap:10px;}
  .stats,.legend{display:none;}
  .search-wrap input{width:120px;}
  #drawer{width:100vw;max-width:100vw;}
  #minimap{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Livro de família</span>
      <h1>Árvore Genealógica</h1>
    </div>
    <button class="btn" id="btn-help" title="Ajuda">❓ Ajuda</button>
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--teal)"></i>Masc.</span>
      <span><i class="dot" style="background:var(--rust)"></i>Fem.</span>
      <span><i class="dot" style="background:var(--brass)"></i>Outro</span>
    </div>
    <div class="spacer"></div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Buscar por nome…">
    </div>
    <button class="btn" id="btn-report">Relatório</button>
    <button class="btn" id="btn-gen-nav">Ver por geração</button>
    <button class="btn" id="btn-gen-colors">Cores por geração</button>
    <button class="btn" id="btn-card-color">Cor dos quadros</button>
    <button class="btn" id="btn-name-color">Cor da letra</button>
    <button class="btn" id="btn-line-thickness">Espessura das linhas</button>
    <button class="btn" id="btn-font-size">Tamanho da letra</button>
    <button class="btn" id="btn-expand-family">🔍 Expandir família</button>
    <button class="btn primary" id="btn-pdf-expanded" style="display:none;">📄 PDF da família expandida</button>
    <button class="btn" id="btn-clear-focus" style="display:none;">✕ Limpar destaque</button>
    <button class="btn" id="btn-reorganize">↻ Reorganizar automaticamente</button>
    <button class="btn" id="btn-shared">🔒 Privado</button>
    <button class="btn" id="btn-present">🖥️ Apresentação</button>
    <button class="btn" id="btn-theme">🌙 Escuro</button>
    <button class="btn" id="btn-import">Importar</button>
    <button class="btn" id="btn-export">Exportar JSON</button>
    <button class="btn" id="btn-export-excel">Exportar Excel</button>
    <button class="btn" id="btn-export-pdf">Salvar PDF</button>
    <button class="btn" id="btn-export-pdf-families">📚 PDF por famílias</button>
    <button class="btn" id="btn-export-json-families">🗂️ JSON por família</button>
    <button class="btn" id="btn-reset">Restaurar original</button>
    <button class="btn danger" id="btn-clear">Zerar árvore</button>
    <button class="btn danger" id="btn-delete-family">🗑️ Excluir família</button>
    <button class="btn" id="btn-undo-delete" style="display:none;">↩️ Desfazer exclusão</button>
    <button class="btn primary" id="btn-new">+ Nova pessoa</button>
    <input type="file" id="file-input" accept="application/json">
  </header>

  <div class="shared-banner" id="shared-banner">
    🔗 Modo compartilhado ativo — esta árvore é visível e editável por qualquer pessoa com acesso a este artefato.
    <button id="shared-banner-exit">Sair do modo compartilhado</button>
  </div>

  <div id="canvas-wrap">
    <div id="viewport">
      <svg id="links-svg"></svg>
      <div id="nodes-layer"></div>
    </div>
    <div class="zoom-controls">
      <button id="zoom-in" title="Aumentar zoom">+</button>
      <div id="zoom-pct" style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);">100%</div>
      <button id="zoom-fit" title="Ajustar à tela">⤢</button>
      <button id="zoom-out" title="Diminuir zoom">–</button>
    </div>
    <button id="exit-presentation" title="Sair da apresentação (Esc)">✕ Sair da apresentação</button>
    <div id="minimap">
      <svg id="minimap-svg" viewBox="0 0 190 130"></svg>
    </div>
  </div>
</div>


<div id="drawer">
  <div class="drawer-head">
    <span class="gender-dot" id="d-gender-dot"></span>
    <h2 id="d-title">Pessoa</h2>

/* ============================= PERSISTENCE ============================= */
async function loadData(){
  // app-prefs (theme, colors, and whether this device is viewing the shared tree) is always personal
  try{
    const res3 = await window.storage.get('app-prefs', false);
    const prefs = (res3 && res3.value) ? JSON.parse(res3.value) : {};
    theme = prefs.theme || 'dark';
    cardColorHex = prefs.cardColor || null;
    lineThickness = prefs.lineThickness || 1;
    nameFontSize = prefs.nameFontSize || 14.5;
    nameColorHex = prefs.nameColorHex || null;
    sharedMode = !!prefs.sharedMode;
  }catch(e){ theme='dark'; cardColorHex=null; sharedMode=false; }

  try{
    const res = await window.storage.get('people-data', sharedMode);
    if(res && res.value){ people = JSON.parse(res.value); }
    else { people = structuredClone(SEED_DATA); await doSave(); }
  }catch(e){ people = structuredClone(SEED_DATA); await doSave(); }
  try{
    const res2 = await window.storage.get('node-positions', sharedMode);
    overrides = (res2 && res2.value) ? JSON.parse(res2.value) : {};
  }catch(e){ overrides = {}; }

  applyTheme(theme, false);
  if(cardColorHex) applyCardColor(cardColorHex, false);
  if(nameColorHex) document.documentElement.style.setProperty('--name-color', nameColorHex);
  document.documentElement.style.setProperty('--name-font-size', nameFontSize+'px');
  updateSharedModeButton();
}
let saveInFlight = false;
let savePending = false;
let lastSaveOk = true;

function persist(){
  clearTimeout(saveTimer);
  setSaveStatus('Alterações pendentes…');
  saveTimer = setTimeout(doSave, 350);
  return Promise.resolve();
}
async function doSave(){
  if(saveInFlight){ savePending = true; return; }
  saveInFlight = true;
  setSaveStatus('Salvando…');
  try{
    await window.storage.set('people-data', JSON.stringify(people), sharedMode);
    await window.storage.set('node-positions', JSON.stringify(overrides), sharedMode);
    lastSaveOk = true;
    setSaveStatus('Salvo às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}));
  }catch(e){
    console.error('storage error', e);
    lastSaveOk = false;
    setSaveStatus('Erro ao salvar — tentando novamente…');
    savePending = true; // retry once the current attempt clears
  }finally{
    saveInFlight = false;
    if(savePending){
      savePending = false;
      setTimeout(doSave, 400);
    }
  }
}
async function forceSaveNow(){
  clearTimeout(saveTimer);
  if(saveInFlight){
    // a save is already running (e.g. from auto-save) — just let it finish instead of firing a second, overlapping write
    savePending = true;
    showToast('Salvando…');
    return;
  }
  await doSave();
  if(lastSaveOk) showToast('Alterações salvas com sucesso.');
  else showToast('Não foi possível salvar agora. A aplicação vai tentar novamente automaticamente.');
}
function setSaveStatus(text){
  const el = document.getElementById('d-save-status');
  if(el) el.textContent = text;
}
function savePrefs(){
  try{ window.storage.set('app-prefs', JSON.stringify({theme, cardColor:cardColorHex, lineThickness, nameFontSize, sharedMode, nameColorHex}), false); }catch(e){}
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function applyTheme(t, save){
  theme = t;
  document.body.classList.toggle('theme-light', theme==='light');
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = theme==='light' ? '☀️ Claro' : '🌙 Escuro';
  if(save!==false) savePrefs();
}
function luminanceHex(hex){
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16)/255, g=parseInt(c.substr(2,2),16)/255, b=parseInt(c.substr(4,2),16)/255;
  const lin = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function shadeHex(hex, amt){
  const c = hex.replace('#','');
  let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  r=Math.min(255,Math.max(0,Math.round(r*(1-amt)))); g=Math.min(255,Math.max(0,Math.round(g*(1-amt)))); b=Math.min(255,Math.max(0,Math.round(b*(1-amt))));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function applyCardColor(hex, save){
  cardColorHex = hex;
  const c2 = shadeHex(hex, 0.12);
  const isDark = luminanceHex(hex) < 0.45;
  document.documentElement.style.setProperty('--card-c1', hex);
  document.documentElement.style.setProperty('--card-c2', c2);
  document.documentElement.style.setProperty('--card-text', isDark ? '#f1ead9' : '#2a2313');
  document.documentElement.style.setProperty('--card-text-dim', isDark ? '#cfc6ae' : '#6b6047');
  if(save!==false) savePrefs();
}
function resetCardColor(){
  cardColorHex = null;
  document.documentElement.style.removeProperty('--card-c1');
  document.documentElement.style.removeProperty('--card-c2');
  document.documentElement.style.removeProperty('--card-text');
  document.documentElement.style.removeProperty('--card-text-dim');
  savePrefs();
}
function applyNameColor(hex, save){
  nameColorHex = hex;
  document.documentElement.style.setProperty('--name-color', hex);
  if(save!==false) savePrefs();
}
function resetNameColor(){
  nameColorHex = null;

}

/* ============================= ID / UTIL ============================= */
function newId(){ return 'p' + Math.random().toString(36).slice(2,10); }
function fullDates(p){
  if(p.birth || p.death) return `${p.birth||'?'} — ${p.death||'presente'}`;
  return '';
}
function normalize(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function normalizeDateStr(raw){
  if(!raw) return '';
  let s = raw.trim();
  if(!s) return '';
  s = s.replace(/[.\-]/g, '/');
  const parts = s.split('/').map(x=>x.trim()).filter(Boolean);
  let d, mo, y;
  if(parts.length===1 && /^\d{4}$/.test(parts[0])){
    y = parts[0]; d = '01'; mo = '01';
  } else if(parts.length===2 && /^\d{1,2}$/.test(parts[0]) && /^\d{4}$/.test(parts[1])){
    mo = parts[0]; y = parts[1]; d = '01';
  } else if(parts.length>=3 && /^\d{1,2}$/.test(parts[0]) && /^\d{1,2}$/.test(parts[1]) && /^\d{4}$/.test(parts[2])){
    d = parts[0]; mo = parts[1]; y = parts[2];
  } else {
    return raw; // unrecognized format (e.g. "circa 1950"): leave untouched
  }
  const dn = Math.min(31, Math.max(1, parseInt(d,10)));
  const mn = Math.min(12, Math.max(1, parseInt(mo,10)));
  return `${String(dn).padStart(2,'0')}/${String(mn).padStart(2,'0')}/${y}`;
}
function parseDateValue(str){
  if(!str) return null;
  const s = String(str).trim();
  let m;
  if(m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)){
    return new Date(+m[3], +m[2]-1, +m[1]);
  }
  if(m = s.match(/^(\d{4})$/)){
    return new Date(+m[1], 0, 1);
  }
  if(m = s.match(/\d{4}/)){
    return new Date(+m[0], 0, 1);
  }
  return null;
}
function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev=>{ img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function computeGenerations(subset){
  subset = subset || people;
  const ids = Object.keys(subset);
  const gen = {}; ids.forEach(id=>gen[id]=0);
  function relax(){
    let changed = true, iter = 0;
    while(changed && iter < ids.length + 5){
      changed = false; iter++;
      ids.forEach(id=>{
        const p = subset[id]; let g = gen[id];
        (p.parentIds||[]).forEach(pid=>{ if(subset[pid]) g = Math.max(g, gen[pid]+1); });
        (p.adoptiveParentIds||[]).forEach(pid=>{ if(subset[pid]) g = Math.max(g, gen[pid]+1); });
        (p.spouseIds||[]).forEach(sid=>{ if(subset[sid]) g = Math.max(g, gen[sid]); });
        (p.exSpouseIds||[]).forEach(sid=>{ if(subset[sid]) g = Math.max(g, gen[sid]); });
        if(g !== gen[id]){ gen[id]=g; changed=true; }
      });
    }
  }
  relax();
  // manual overrides win over the automatic calculation (user-set generation)
  let anyOverride = false;
  ids.forEach(id=>{
    const ov = subset[id].genOverride;
    if(ov !== null && ov !== undefined && ov !== ''){
      const n = Number(ov);
      if(!isNaN(n)){ gen[id] = Math.max(0, Math.round(n) - 1); anyOverride = true; }
    }
  });
  if(anyOverride) relax();
  return gen;
}
function buildClusters(subset){
  subset = subset || people;
  const parent = {};
  Object.keys(subset).forEach(id=>parent[id]=id);
  function find(x){ while(parent[x]!==x) x=parent[x]; return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
  Object.values(subset).forEach(p=>{
    (p.spouseIds||[]).forEach(sid=>{ if(subset[sid]) union(p.id, sid); });
    (p.exSpouseIds||[]).forEach(sid=>{ if(subset[sid]) union(p.id, sid); });
  });
  const clusters = {};
  Object.keys(subset).forEach(id=>{
    const r = find(id);
    (clusters[r] = clusters[r] || []).push(id);
  });
  return clusters;
}
function layoutTree(subset){
  subset = subset || people;
  const gen = computeGenerations(subset);
  const clustersMap = buildClusters(subset);
  const clusterGen = {};
  Object.entries(clustersMap).forEach(([root, members])=>{
    clusterGen[root] = Math.min(...members.map(id=>gen[id]));
  });
  const gensPresent = {};
  Object.entries(clusterGen).forEach(([root,g])=>{ (gensPresent[g]=gensPresent[g]||[]).push(root); });
  const genList = Object.keys(gensPresent).map(Number).sort((a,b)=>a-b);

  const originalIndex = {}; Object.keys(subset).forEach((id,i)=>originalIndex[id]=i);
  const positionKey = {};
  const clusterOrderIndex = {};

  genList.forEach(g=>{
    const roots = gensPresent[g];
    const keyed = roots.map(root=>{
      const members = clustersMap[root];
      // Pick the single most common parent position among this cluster's members (instead of
      // averaging every listed parent). Averaging could produce a fractional key that drifts
      // between two different families' blocks, letting their children interleave; using the
      // most common parent keeps each family's own children contiguous.
      const counts = {};
      members.forEach(id=>{
        (subset[id].parentIds||[]).concat(subset[id].adoptiveParentIds||[]).forEach(pid=>{
          if(positionKey[pid] !== undefined) counts[positionKey[pid]] = (counts[positionKey[pid]]||0)+1;
        });
      });
      const entries = Object.entries(counts);
      let key = Infinity;
      if(entries.length){
        entries.sort((a,b)=> b[1]-a[1] || (Number(a[0])-Number(b[0])));
        key = Number(entries[0][0]);
      }
      const minOrig = Math.min(...members.map(id=>originalIndex[id]));
      return {root, key, minOrig};
    });
    keyed.sort((a,b)=> (a.key-b.key) || (a.minOrig-b.minOrig));
    keyed.forEach((k, idx)=>{
      clusterOrderIndex[k.root] = idx;
      clustersMap[k.root].forEach(id=> positionKey[id] = idx);
    });
  });

  const pos = {};
  genList.forEach(g=>{
    const roots = gensPresent[g].slice().sort((a,b)=>clusterOrderIndex[a]-clusterOrderIndex[b]);
    let cursorX = 0;
    roots.forEach(root=>{
      const members = clustersMap[root].slice().sort((a,b)=>originalIndex[a]-originalIndex[b]);
      members.forEach(id=>{
        pos[id] = { x: cursorX, y: g*ROW_H };
        cursorX += CARD_W + SPOUSE_GAP;
      });
      cursorX += CLUSTER_GAP - SPOUSE_GAP;
    });
  });
  return { pos, gen, genList, clustersMap, clusterOrderIndex };
}

/* ============================= FAMILY SUBSET (for PDF / scoped export) ============================= */
function getConnectedComponent(rootId){
  const visited = new Set([rootId]);
  const queue = [rootId];
  while(queue.length){
    const id = queue.shift();
    const p = people[id]; if(!p) continue;
    const neighbors = [
      ...(p.parentIds||[]), ...(p.adoptiveParentIds||[]), ...(p.spouseIds||[]), ...(p.exSpouseIds||[]),
      ...Object.values(people).filter(x=>(x.parentIds||[]).includes(id) || (x.adoptiveParentIds||[]).includes(id)).map(x=>x.id)
    ];
    neighbors.forEach(nid=>{
      if(nid && people[nid] && !visited.has(nid)){ visited.add(nid); queue.push(nid); }
    });
  }
  return visited;
}
function buildFamilySubset(rootId){
  const ids = getConnectedComponent(rootId);
  const subset = {};
  ids.forEach(id=> subset[id] = people[id]);
  return subset;
}
function buildDescendantFamilySubset(rootId){
  const root = people[rootId];
  if(!root) return { subset:{}, halfSet:new Set(), blood:new Set() };
  const included = new Set([rootId]);
  const blood = new Set([rootId]); // ids blood-related to the chosen root
  const halfSet = new Set(); // included children with no blood link to root (child of a spouse with someone else)
  const queue = [rootId]; // ids whose spouses/children we still need to explore

  const addSpousesFor = id=>{
    const p = people[id]; if(!p) return;
    (p.spouseIds||[]).concat(p.exSpouseIds||[]).forEach(sid=>{
      if(people[sid] && !included.has(sid)){ included.add(sid); queue.push(sid); }
    });
  };

  addSpousesFor(rootId);
  while(queue.length){
    const id = queue.shift();
    Object.values(people).forEach(child=>{
      const isChild = (child.parentIds||[]).includes(id) || (child.adoptiveParentIds||[]).includes(id);
      if(isChild && !included.has(child.id)){
        included.add(child.id);
        const parents = (child.parentIds||[]).concat(child.adoptiveParentIds||[]);
        const isBlood = parents.some(pid=>blood.has(pid));
        if(isBlood) blood.add(child.id); else halfSet.add(child.id);
        queue.push(child.id);
        addSpousesFor(child.id);
      }
    });
  }
  const subset = {}; included.forEach(id=> subset[id]=people[id]);
  return { subset, halfSet, blood };
}
function buildAncestorFamilySubset(rootId){
  const root = people[rootId];
  if(!root) return {};
  const included = new Set([rootId]);

  // siblings: anyone sharing at least one parent/adoptive parent with root
  const rootParents = new Set([...(root.parentIds||[]), ...(root.adoptiveParentIds||[])]);
  if(rootParents.size){
    Object.values(people).forEach(x=>{
      if(x.id===rootId) return;
      const xParents = [...(x.parentIds||[]), ...(x.adoptiveParentIds||[])];
      if(xParents.some(pid=>rootParents.has(pid))) included.add(x.id);
    });
  }

  // ancestors: walk up via parents/adoptive parents, including each ancestor's spouse(s)
  const visited = new Set([rootId]);
  const queue = [rootId];
  while(queue.length){
    const id = queue.shift();
    const p = people[id]; if(!p) continue;
    const parentIds = [...(p.parentIds||[]), ...(p.adoptiveParentIds||[])];
    parentIds.forEach(pid=>{
      if(!people[pid]) return;
      included.add(pid);
      const anc = people[pid];
      (anc.spouseIds||[]).concat(anc.exSpouseIds||[]).forEach(sid=>{
        if(people[sid]) included.add(sid);
      });
      if(!visited.has(pid)){ visited.add(pid); queue.push(pid); }
    });
  }
  const subset = {}; included.forEach(id=> subset[id]=people[id]);
  return subset;
}
function listFamilyRoots(){
  // people with no parents/adoptive parents are natural "family founders"
  const roots = Object.values(people).filter(p => (p.parentIds||[]).length===0 && (p.adoptiveParentIds||[]).length===0);
  return roots.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
}

/* ============================= RENDER ============================= */
function render(){
  const { pos, gen, genList } = layoutTree();
  lastLayout = { pos, gen };
  // keep manual x-overrides but always snap y to the correct generation row
  Object.keys(overrides).forEach(id=>{
    if(gen[id]!==undefined) overrides[id].y = gen[id]*ROW_H;
  });
  const finalPos = {};
  Object.keys(people).forEach(id=>{
    finalPos[id] = overrides[id] || pos[id] || {x:0,y:0};
  });

  const nodesLayer = document.getElementById('nodes-layer');
  const svg = document.getElementById('links-svg');
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  let maxX=0, maxY=0;
  Object.values(finalPos).forEach(p=>{ maxX=Math.max(maxX,p.x+CARD_W); maxY=Math.max(maxY,p.y+CARD_H); });
  svg.setAttribute('width', maxX+400);
  svg.setAttribute('height', maxY+200);
  nodesLayer.style.width = (maxX+400)+'px';
  nodesLayer.style.height = (maxY+200)+'px';

  // generation labels
  genList.forEach(g=>{
    const lbl = document.createElement('div');
    lbl.className='gen-label';
    lbl.style.left='-4px';
    lbl.style.top=(g*ROW_H + CARD_H/2 - 8)+'px';
    lbl.textContent = 'Geração ' + (g+1);
    lbl.style.position='absolute';
    lbl.style.transform='translateX(-100%)';
    lbl.style.marginLeft='-16px';
    nodesLayer.appendChild(lbl);
  });

  // spouse / ex-spouse ties
  const drawnPairs = new Set();
  Object.values(people).forEach(p=>{
    (p.spouseIds||[]).forEach(sid=>{
      if(!people[sid]) return;
      const key = [p.id,sid].sort().join('|');
      if(drawnPairs.has(key)) return; drawnPairs.add(key);
      drawTie(svg, finalPos[p.id], finalPos[sid], false, coupleHasChildren(p.id,sid));
    });
    (p.exSpouseIds||[]).forEach(sid=>{
      if(!people[sid]) return;
      const key = 'ex|'+[p.id,sid].sort().join('|');
      if(drawnPairs.has(key)) return; drawnPairs.add(key);
      drawTie(svg, finalPos[p.id], finalPos[sid], true, coupleHasChildren(p.id,sid));
    });
  });

  // parent-child links (biological)
  Object.values(people).forEach(child=>{
    const parentsPresent = (child.parentIds||[]).filter(id=>people[id] && finalPos[id]);
    if(parentsPresent.length===0) return;
    drawParentChildLink(svg, finalPos, parentsPresent, child.id, false);
  });
  // parent-child links (adoptive)
  Object.values(people).forEach(child=>{
    const parentsPresent = (child.adoptiveParentIds||[]).filter(id=>people[id] && finalPos[id]);
    if(parentsPresent.length===0) return;
    drawParentChildLink(svg, finalPos, parentsPresent, child.id, true);
  });

  // cards
  Object.values(people).forEach(p=>{
    const fp = finalPos[p.id];
    const g = gen[p.id];
    const card = document.createElement('div');
    let cls = 'person-card' + (p.id===selectedId ? ' selected':'');
    if(focusGen!==null && g!==focusGen) cls += ' dimmed';
    if(focusFamilyIds && !focusFamilyIds.has(p.id)) cls += ' dimmed';
    card.className = cls;
    card.style.left = fp.x+'px';
    card.style.top = fp.y+'px';
    if(genColorMode){
      const base = GEN_PALETTE[g % GEN_PALETTE.length];
      card.style.background = `linear-gradient(180deg, ${base}, ${shadeHex(base,0.18)})`;
      card.style.setProperty('--card-text', luminanceHex(base) < 0.45 ? '#f6f1e4' : '#241f14');
    }
    card.dataset.id = p.id;
    card.innerHTML = `
      ${p.photo ? `<img class="avatar" src="${p.photo}" alt="">` : ''}
      <div class="bar" style="background:${genColorMode ? 'rgba(255,255,255,.55)' : genderColor(p.gender)}"></div>
      <div class="name" title="${escapeHtml(p.name||'(sem nome)')}">${escapeHtml(p.name||'(sem nome)')}</div>
      <div class="dates" style="${genColorMode?'color:var(--card-text);opacity:.75':''}">${fullDates(p)}</div>
      <div>
        ${(p.adoptiveParentIds&&p.adoptiveParentIds.length) ? `<span class="tag adoptive">🌱 adotivo(a)</span>` : ''}
        ${p.notes ? `<span class="tag">📝 nota</span>` : ''}
      </div>
    `;
    attachDrag(card, p.id);
    card.addEventListener('click', (e)=>{
      if(card._dragged) { card._dragged=false; return; }
      openDrawer(p.id);
    });
    nodesLayer.appendChild(card);
  });

  document.getElementById('stats').textContent =
    `${Object.keys(people).length} pessoas · ${genList.length} gerações`;
  renderMinimap();
  updateClearFocusButton();
}

/* ============================= MINIMAP ============================= */
let mmTransform = { scale:0, minX:0, minY:0, pad:6 };
function renderMinimap(){
  const svg = document.getElementById('minimap-svg');
  if(!svg) return;
  svg.innerHTML = '';
  const ids = Object.keys(people);
  if(!ids.length){ mmTransform.scale = 0; return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  ids.forEach(id=>{
    const fp = overrides[id] || lastLayout.pos[id]; if(!fp) return;
    minX=Math.min(minX,fp.x); minY=Math.min(minY,fp.y);
    maxX=Math.max(maxX,fp.x+CARD_W); maxY=Math.max(maxY,fp.y+CARD_H);
  });
  if(!isFinite(minX)){ mmTransform.scale = 0; return; }
  const pad = 6;
  const treeW = Math.max(1,maxX-minX), treeH = Math.max(1,maxY-minY);
  const s = Math.min((190-pad*2)/treeW, (130-pad*2)/treeH);
  mmTransform = { scale:s, minX, minY, pad };
  ids.forEach(id=>{
    const fp = overrides[id] || lastLayout.pos[id]; if(!fp) return;
    const x = (fp.x-minX)*s+pad, y=(fp.y-minY)*s+pad;
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', Math.max(2, CARD_W*s)); rect.setAttribute('height', Math.max(2, CARD_H*s));
    rect.setAttribute('rx', 1);
    rect.setAttribute('class','mm-node');
    rect.setAttribute('fill', genderColorHex(people[id].gender));
    svg.appendChild(rect);
  });
  const vp = document.createElementNS('http://www.w3.org/2000/svg','rect');
  vp.setAttribute('id','mm-viewport-rect');
  vp.setAttribute('class','mm-viewport');
  svg.appendChild(vp);
  updateMinimapViewport();
}
function updateMinimapViewport(){
  const vp = document.getElementById('mm-viewport-rect');
  const wrap = document.getElementById('canvas-wrap');
  if(!vp || !wrap || !mmTransform.scale) return;
  const rect = wrap.getBoundingClientRect();
  const visMinX = -tx/scale, visMinY = -ty/scale;
  const visW = rect.width/scale, visH = rect.height/scale;
  const { scale:s, minX, minY, pad } = mmTransform;
  vp.setAttribute('x', (visMinX-minX)*s+pad);
  vp.setAttribute('y', (visMinY-minY)*s+pad);
  vp.setAttribute('width', Math.max(2, visW*s));
  vp.setAttribute('height', Math.max(2, visH*s));
}
function setupMinimap(){
  const svg = document.getElementById('minimap-svg');
  if(!svg) return;
  function navigateTo(evt){
    if(!mmTransform.scale) return;
    const rect = svg.getBoundingClientRect();
    const px = (evt.clientX-rect.left)/rect.width*190;
    const py = (evt.clientY-rect.top)/rect.height*130;
    const { scale:s, minX, minY, pad } = mmTransform;
    const treeX = (px-pad)/s + minX;
    const treeY = (py-pad)/s + minY;
    const wrap = document.getElementById('canvas-wrap');
    const wrect = wrap.getBoundingClientRect();
    tx = wrect.width/2 - treeX*scale;
    ty = wrect.height/2 - treeY*scale;
    applyTransform();
  }
  let dragging = false;
  svg.addEventListener('pointerdown', e=>{ dragging=true; navigateTo(e); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e=>{ if(dragging) navigateTo(e); });
  svg.addEventListener('pointerup', ()=>{ dragging=false; });
}

function drawParentChildLink(svg, finalPos, parentsPresent, childId, isAdoptive){
  let ux, uy;
  if(parentsPresent.length>=2){
    const a=finalPos[parentsPresent[0]], b=finalPos[parentsPresent[1]];
    ux = (a.x+CARD_W/2 + b.x+CARD_W/2)/2;
    uy = Math.max(a.y,b.y) + CARD_H;
  } else {
    const a=finalPos[parentsPresent[0]];
    ux = a.x+CARD_W/2; uy = a.y+CARD_H;
  }
  const c = finalPos[childId];
  const cx = c.x+CARD_W/2, cy = c.y;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  const midY = (uy+cy)/2;
  path.setAttribute('d', `M ${ux} ${uy} C ${ux} ${midY}, ${cx} ${midY}, ${cx} ${cy}`);
  path.setAttribute('stroke', isAdoptive ? 'rgba(62,110,100,0.7)' : 'rgba(198,155,74,0.55)');
  path.setAttribute('stroke-width', String(2*lineThickness));
  path.setAttribute('fill', 'none');
  if(isAdoptive) path.setAttribute('stroke-dasharray', '6,4');
  svg.appendChild(path);
}
function coupleHasChildren(idA, idB){
  return Object.values(people).some(x=>{
    const ps = (x.parentIds||[]).concat(x.adoptiveParentIds||[]);
    return ps.includes(idA) && ps.includes(idB);
  });
}
function drawTie(svg, a, b, isEx, hasKids){
  if(!a || !b) return;
  const useA = a.x < b.x ? a : b;
  const useB = a.x < b.x ? b : a;
  const x1 = useA.x+CARD_W, y1 = useA.y+CARD_H/2;
  const x2 = useB.x, y2 = useB.y+CARD_H/2;
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1);
  line.setAttribute('x2',x2); line.setAttribute('y2',y2);
  line.setAttribute('stroke', isEx ? 'rgba(143,138,122,0.55)' : '#c69b4a');
  line.setAttribute('stroke-width', String((isEx ? 1.5 : 2.5)*lineThickness));
  if(isEx) line.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(line);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const markerR = 3 + 1.5*lineThickness;
  if(!isEx){
    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circ.setAttribute('cx',mx); circ.setAttribute('cy',my); circ.setAttribute('r',String(markerR));
    circ.setAttribute('fill','#c69b4a');
    svg.appendChild(circ);
  } else if(hasKids){
    // ring marker: indicates this ex-couple has children together
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx',mx); ring.setAttribute('cy',my); ring.setAttribute('r',String(markerR+1));
    ring.setAttribute('fill','none');
    ring.setAttribute('stroke','#c69b4a');
    ring.setAttribute('stroke-width', String(1.5*lineThickness));
    svg.appendChild(ring);
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',mx); dot.setAttribute('cy',my); dot.setAttribute('r','1.6');
    dot.setAttribute('fill','#c69b4a');
    svg.appendChild(dot);
  }
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ============================= DRAG (node) ============================= */
function attachDrag(el, id){
  let dragging=false, startX, origX, rowY;
  el.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    dragging=true; el._dragged=false;
    startX=e.clientX;
    const fp = overrides[id] || lastLayout.pos[id] || {x:0,y:0};
    origX=fp.x;
    // lock vertical position to this person's generation row, so dragging only reorders within the line
    const g = lastLayout.gen[id];
    rowY = (g!==undefined) ? g*ROW_H : fp.y;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = (e.clientX-startX)/scale;
    if(Math.abs(dx)>3) el._dragged=true;
    if(!el._dragged) return;
    const nx = origX+dx;
    overrides[id] = {x:nx, y:rowY};
    el.style.left = nx+'px'; el.style.top = rowY+'px';
    redrawLinksOnly();
  });
  el.addEventListener('pointerup', e=>{
    if(dragging && el._dragged){ persist(); }
    dragging=false;
  });
}
function redrawLinksOnly(){ render(); }

/* ============================= PAN / ZOOM ============================= */
function applyTransform(){
  document.getElementById('viewport').style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  const pctEl = document.getElementById('zoom-pct');
  if(pctEl) pctEl.textContent = Math.round(scale*100)+'%';
  updateMinimapViewport();
}
function setupPanZoom(){
  const wrap = document.getElementById('canvas-wrap');
  let panning=false, sx,sy, stx,sty;
  wrap.addEventListener('pointerdown', e=>{
    if(e.target.closest('.person-card')) return;
    panning=true; wrap.classList.add('grabbing');
    sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  });
  window.addEventListener('pointermove', e=>{
    if(!panning) return;
    tx = stx + (e.clientX-sx); ty = sty + (e.clientY-sy);
    applyTransform();
  });
  window.addEventListener('pointerup', ()=>{ panning=false; wrap.classList.remove('grabbing'); });
  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const wx = (mx-tx)/scale, wy = (my-ty)/scale;
    const delta = e.deltaY>0 ? 0.9 : 1.1;
    scale = Math.min(2.5, Math.max(0.22, scale*delta));
    tx = mx - wx*scale; ty = my - wy*scale;
    applyTransform();
  }, {passive:false});

  document.getElementById('zoom-in').onclick = ()=>{ scale=Math.min(2.5,scale*1.2); applyTransform(); };
  document.getElementById('zoom-out').onclick = ()=>{ scale=Math.max(0.22,scale*0.8); applyTransform(); };
  document.getElementById('zoom-fit').onclick = fitView;
}
function fitView(){
  const ids = Object.keys(people);
  if(!ids.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  ids.forEach(id=>{
    const fp = overrides[id] || lastLayout.pos[id]; if(!fp) return;
    minX=Math.min(minX,fp.x); minY=Math.min(minY,fp.y);
    maxX=Math.max(maxX,fp.x+CARD_W); maxY=Math.max(maxY,fp.y+CARD_H);
  });
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const w = maxX-minX+120, h = maxY-minY+120;
  scale = Math.min(1.1, Math.min(rect.width/w, rect.height/h));
  tx = -minX*scale + 60; ty = -minY*scale + 40;
  applyTransform();
}

function closeDrawer(){

  const body = document.getElementById('d-body');
  const genMap = (lastLayout.gen && Object.keys(lastLayout.gen).length) ? lastLayout.gen : computeGenerations();

  const isManualGen = p.genOverride !== null && p.genOverride !== undefined && p.genOverride !== '';
  const parents = (p.parentIds||[]).map(id=>people[id]).filter(Boolean);
  const adoptiveParents = (p.adoptiveParentIds||[]).map(id=>people[id]).filter(Boolean);
  const spouses = (p.spouseIds||[]).map(id=>people[id]).filter(Boolean);

function chip(name, onRemove, dashed, readOnly){
  if(readOnly){
    return `<span class="chip${dashed?' dashed':''}">${escapeHtml(name||'(sem nome)')}</span>`;
  }
  const cid = 'chip'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{ const el=document.getElementById(cid); if(el) el.querySelector('button').onclick=onRemove; },0);
  return `<span class="chip${dashed?' dashed':''}" id="${cid}">${escapeHtml(name||'(sem nome)')}<button>✕</button></span>`;
}
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function removeParent(pid){ const p=people[selectedId]; p.parentIds=(p.parentIds||[]).filter(x=>x!==pid); renderDrawerBody(); render(); persist(); }
function removeSpouse(sid){ const p=people[selectedId]; p.spouseIds=(p.spouseIds||[]).filter(x=>x!==sid); if(people[sid]) people[sid].spouseIds=(people[sid].spouseIds||[]).filter(x=>x!==selectedId); renderDrawerBody(); render(); persist(); }
function removeExSpouse(sid){ const p=people[selectedId]; p.exSpouseIds=(p.exSpouseIds||[]).filter(x=>x!==sid); if(people[sid]) people[sid].exSpouseIds=(people[sid].exSpouseIds||[]).filter(x=>x!==selectedId); renderDrawerBody(); render(); persist(); }
function removeChild(cid){ if(people[cid]){ people[cid].parentIds=(people[cid].parentIds||[]).filter(x=>x!==selectedId); } renderDrawerBody(); render(); persist(); }
function removeAdoptiveParent(pid){ const p=people[selectedId]; p.adoptiveParentIds=(p.adoptiveParentIds||[]).filter(x=>x!==pid); renderDrawerBody(); render(); persist(); }
function removeAdoptiveChild(cid){ if(people[cid]){ people[cid].adoptiveParentIds=(people[cid].adoptiveParentIds||[]).filter(x=>x!==selectedId); } renderDrawerBody(); render(); persist(); }

document.getElementById('d-delete').onclick = ()=>{

  const p = people[selectedId];
  if(!confirm(`Remover "${p.name}" da árvore? Esta ação não pode ser desfeita.`)) return;
  const id = selectedId;
  Object.values(people).forEach(x=>{
    x.parentIds=(x.parentIds||[]).filter(y=>y!==id);
    x.adoptiveParentIds=(x.adoptiveParentIds||[]).filter(y=>y!==id);
    x.spouseIds=(x.spouseIds||[]).filter(y=>y!==id);
    x.exSpouseIds=(x.exSpouseIds||[]).filter(y=>y!==id);
  });
  delete people[id];

/* ============================= LINK MODAL ============================= */
function openLinkModal({mode, personId, title}){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  const p = people[personId];
  const spouseOptions = mode==='child' ? (p.spouseIds||[]).map(id=>people[id]).filter(Boolean) : [];

  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">${title}</div>
      <div class="modal-body">
        ${mode==='child' ? `
          <div class="field">
            <label>Outro pai/mãe (opcional)</label>
            <select id="m-other-parent">
              <option value="">Nenhum / pai-mãe único</option>
              ${spouseOptions.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
        ` : ''}
        ${(mode==='child' || mode==='sibling') ? `<label class="checkbox-row"><input type="checkbox" id="m-adoptive"> Vínculo adotivo</label>` : ''}
        <div class="field">
          <label>Buscar pessoa existente</label>
          <input type="text" id="m-search" placeholder="Digite um nome…">
        </div>
        <div id="m-results" style="max-height:160px;overflow-y:auto;"></div>
        <div class="divider-text">ou crie uma nova pessoa</div>
        <div class="field"><label>Nome</label><input type="text" id="m-newname" placeholder="Nome completo"></div>
        <div class="field-row">
          <div class="field">
            <label>Gênero</label>
            <select id="m-newgender">
              <option value="male">Masculino</option>
              <option value="female">Feminino</option>
              <option value="other">Outro</option>
            </select>
          </div>
          <div class="field"><label>Nascimento</label><input type="text" id="m-newbirth" placeholder="dd/mm/aaaa ou aaaa"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn primary" id="m-create">Criar e vincular</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function renderResults(query){
    const res = document.getElementById('m-results');
    if(!query){ res.innerHTML=''; return; }
    const q = normalize(query);
    const matches = Object.values(people).filter(x=>x.id!==personId && normalize(x.name).includes(q)).slice(0,20);
    res.innerHTML = matches.map(m=>`<div class="person-option" data-id="${m.id}">${escapeHtml(m.name)} <small>${m.birth||''}</small></div>`).join('') || `<div class="empty-hint" style="padding:6px 2px;">Nenhum resultado.</div>`;
    res.querySelectorAll('.person-option').forEach(el=>{
      el.onclick = ()=>{
        linkExisting(mode, personId, el.dataset.id, document.getElementById('m-other-parent')?.value, document.getElementById('m-adoptive')?.checked);
        document.body.removeChild(overlay);
        renderDrawerBody(); render(); persist();
      };
    });
  }
  document.getElementById('m-search').addEventListener('input', e=>renderResults(e.target.value));
  document.getElementById('m-cancel').onclick = ()=>document.body.removeChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) document.body.removeChild(overlay); });

  document.getElementById('m-create').onclick = ()=>{
    const name = document.getElementById('m-newname').value.trim();
    if(!name){ showToast('Digite um nome para a nova pessoa.'); return; }
    const gender = document.getElementById('m-newgender').value;
    const birth = normalizeDateStr(document.getElementById('m-newbirth').value.trim());
    const id = newId();
    people[id] = { id, name, gender, birth, death:'', notes:'', photo:'', genOverride:null, parentIds:[], adoptiveParentIds:[], spouseIds:[], exSpouseIds:[] };
    linkExisting(mode, personId, id, document.getElementById('m-other-parent')?.value, document.getElementById('m-adoptive')?.checked);
    document.body.removeChild(overlay);
    renderDrawerBody(); render(); persist();
    showToast(`${name} adicionado(a).`);
  };
}
function linkExisting(mode, personId, otherId, otherParentId, isAdoptive){
  const p = people[personId], o = people[otherId];
  if(!p || !o) return;
  p.adoptiveParentIds = p.adoptiveParentIds||[]; o.adoptiveParentIds = o.adoptiveParentIds||[];
  if(mode==='parent'){
    if(!p.parentIds.includes(otherId)) p.parentIds.push(otherId);
  } else if(mode==='adoptiveParent'){
    if(!p.adoptiveParentIds.includes(otherId)) p.adoptiveParentIds.push(otherId);
  } else if(mode==='spouse'){
    if(!p.spouseIds.includes(otherId)) p.spouseIds.push(otherId);
    if(!o.spouseIds.includes(personId)) o.spouseIds.push(personId);
  } else if(mode==='exSpouse'){
    if(!p.exSpouseIds.includes(otherId)) p.exSpouseIds.push(otherId);
    if(!o.exSpouseIds.includes(personId)) o.exSpouseIds.push(personId);
  } else if(mode==='child'){
    const listField = isAdoptive ? 'adoptiveParentIds' : 'parentIds';
    if(!o[listField].includes(personId)) o[listField].push(personId);
    if(otherParentId && !o[listField].includes(otherParentId)) o[listField].push(otherParentId);
  } else if(mode==='sibling'){
    const sourceParents = (p.parentIds||[]).length ? (p.parentIds||[]) : (p.adoptiveParentIds||[]);
    const targetField = isAdoptive ? 'adoptiveParentIds' : 'parentIds';
    o[targetField] = o[targetField] || [];
    sourceParents.forEach(pid=>{ if(!o[targetField].includes(pid)) o[targetField].push(pid); });
  }
}

async function setPresentationMode(on){

  document.body.classList.toggle('presentation-mode', on);
  const btn = document.getElementById('btn-present');
  if(btn) btn.textContent = on ? '🖥️ Sair da apresentação' : '🖥️ Apresentação';
  if(on){
    try{ await document.documentElement.requestFullscreen(); }catch(e){ /* fullscreen may be blocked in an embedded frame — CSS-only mode still applies */ }
  } else if(document.fullscreenElement){
    try{ await document.exitFullscreen(); }catch(e){}
  }
  setTimeout(fitView, 120);
}

document.getElementById('btn-shared').onclick = async ()=>{
  if(sharedMode){
    if(!confirm('Voltar para o modo privado? Suas próximas edições deixarão de ser visíveis para outras pessoas (a árvore compartilhada continua existindo).')) return;
    sharedMode = false;
    updateSharedModeButton();
    savePrefs();
    showToast('Modo privado ativado.');
    return;
  }
  if(!confirm('No modo compartilhado, esta árvore fica visível (e editável) por qualquer pessoa que abrir este mesmo artefato. Deseja continuar?')) return;
  showToast('Verificando árvore compartilhada…');
  let sharedExists = false;
  try{
    const res = await window.storage.get('people-data', true);
    sharedExists = !!(res && res.value && Object.keys(JSON.parse(res.value)).length);
  }catch(e){ sharedExists = false; }

  if(sharedExists){
    const loadShared = confirm('Já existe uma árvore compartilhada salva. Clique OK para CARREGAR essa árvore (substituindo a sua atual na tela), ou Cancelar para PUBLICAR a sua árvore atual como a nova versão compartilhada (substituindo a existente).');
    if(loadShared){
      try{
        const res = await window.storage.get('people-data', true);
        people = JSON.parse(res.value);
        const res2 = await window.storage.get('node-positions', true);
        overrides = (res2 && res2.value) ? JSON.parse(res2.value) : {};
      }catch(e){ showToast('Não foi possível carregar a árvore compartilhada.'); return; }
      sharedMode = true;
      closeDrawer(); render(); fitView();
      updateSharedModeButton(); savePrefs();
      showToast('Árvore compartilhada carregada.');
      return;
    }
  }
  // publish current local tree as the shared version
  sharedMode = true;
  updateSharedModeButton(); savePrefs();
  await doSave();
  showToast('Sua árvore agora é a versão compartilhada.');
};

  if(!e.target.closest('.popover') && !e.target.closest('#btn-card-color') && !e.target.closest('#btn-name-color') && !e.target.closest('#btn-line-thickness') && !e.target.closest('#btn-font-size')) closePopovers();
});

/* ============================= DELETE FAMILY (with undo) ============================= */
document.getElementById('btn-delete-family').onclick = ()=>{
  openPersonPickerModal('Excluir família', 'Escolha a pessoa principal. Ela e todos os descendentes de sangue serão excluídos. Cônjuges que pertencem a outra família da árvore são preservados (apenas desvinculados).', rootId=>{
    const root = people[rootId];
    const { subset, halfSet, blood } = buildDescendantFamilySubset(rootId);
    const hasOwnOrigin = id => {
      const p = people[id];
      return p && ((p.parentIds||[]).length>0 || (p.adoptiveParentIds||[]).length>0);
    };
    const scopeIds = [];       // will be deleted
    const keptSpouseIds = [];  // stay in the tree, only unlinked from this family
    Object.keys(subset).forEach(id=>{
      if(halfSet.has(id)) return; // not part of this family at all
      if(blood.has(id) || !hasOwnOrigin(id)){
        scopeIds.push(id); // true descendant, or a spouse with no family of origin of their own
      } else {
        keptSpouseIds.push(id); // spouse belongs to another family branch — preserve them
      }
    });
    const names = scopeIds.map(id=>people[id]?.name).filter(Boolean);
    const keptNames = keptSpouseIds.map(id=>people[id]?.name).filter(Boolean);
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.style.width = '460px';
    modal.innerHTML = `
      <div class="modal-head">Confirmar exclusão</div>
      <div class="modal-body">
        <div class="empty-hint" style="color:var(--danger);margin-bottom:10px;">Esta ação removerá <strong>${scopeIds.length} pessoa(s)</strong> da árvore — ${escapeHtml(root.name)} e seus descendentes de sangue. Você poderá desfazer logo em seguida, se precisar.</div>
        <div class="chip-list" style="max-height:180px;overflow-y:auto;">
          ${names.map(n=>`<span class="chip dashed">${escapeHtml(n)}</span>`).join('')}
        </div>
        ${keptNames.length ? `
          <div class="section-title">Preservados (pertencem a outra família)</div>
          <div class="empty-hint" style="margin-bottom:8px;">Estas pessoas continuam na árvore, apenas desvinculadas desta família:</div>
          <div class="chip-list" style="max-height:120px;overflow-y:auto;">
            ${keptNames.map(n=>`<span class="chip">${escapeHtml(n)}</span>`).join('')}
          </div>
        ` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" id="df-cancel">Cancelar</button>
        <button class="btn danger" id="df-confirm">Excluir ${scopeIds.length} pessoa(s)</button>
      </div>
    `;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    document.getElementById('df-cancel').onclick = ()=>document.body.removeChild(overlay);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) document.body.removeChild(overlay); });
    document.getElementById('df-confirm').onclick = ()=>{
      document.body.removeChild(overlay);
      deleteFamily(scopeIds);
    };
  });
};

function deleteFamily(idsToDelete){
  lastDeletionSnapshot = { people: structuredClone(people), overrides: structuredClone(overrides) };
  const idSet = new Set(idsToDelete);
  idSet.forEach(id=> delete people[id]);
  Object.values(people).forEach(x=>{
    x.parentIds = (x.parentIds||[]).filter(y=>!idSet.has(y));
    x.adoptiveParentIds = (x.adoptiveParentIds||[]).filter(y=>!idSet.has(y));
    x.spouseIds = (x.spouseIds||[]).filter(y=>!idSet.has(y));
    x.exSpouseIds = (x.exSpouseIds||[]).filter(y=>!idSet.has(y));
  });
  idSet.forEach(id=> delete overrides[id]);
  if(focusFamilyIds){ idSet.forEach(id=>focusFamilyIds.delete(id)); if(!focusFamilyIds.size) focusFamilyIds=null; }
  if(expandedFamilyRootId && idSet.has(expandedFamilyRootId)) expandedFamilyRootId = null;
  if(selectedId && idSet.has(selectedId)) closeDrawer();
  render();
  persist();
  document.getElementById('btn-undo-delete').style.display = 'inline-flex';
  showToast(`${idSet.size} pessoa(s) excluída(s). Use "Desfazer exclusão" se precisar reverter.`);
}

document.getElementById('btn-undo-delete').onclick = ()=>{
  if(!lastDeletionSnapshot) return;
  people = lastDeletionSnapshot.people;
  overrides = lastDeletionSnapshot.overrides;
  lastDeletionSnapshot = null;
  document.getElementById('btn-undo-delete').style.display = 'none';
  closeDrawer();
  render();
  persist();
  fitView();
  showToast('Exclusão desfeita com sucesso.');
};
function fitViewToIds(ids){
  if(!ids.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  ids.forEach(id=>{
    const fp = overrides[id] || lastLayout.pos[id]; if(!fp) return;
    minX=Math.min(minX,fp.x); minY=Math.min(minY,fp.y);
    maxX=Math.max(maxX,fp.x+CARD_W); maxY=Math.max(maxY,fp.y+CARD_H);
  });
  if(!isFinite(minX)) return;
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const w = maxX-minX+140, h = maxY-minY+140;
  scale = Math.min(1.6, Math.min(rect.width/w, rect.height/h));
  tx = -minX*scale + 70; ty = -minY*scale + 50;
  applyTransform();
}
function updateClearFocusButton(){
  const btn = document.getElementById('btn-clear-focus');
  if(btn) btn.style.display = (focusGen!==null || focusFamilyIds) ? 'inline-flex' : 'none';
  const pdfBtn = document.getElementById('btn-pdf-expanded');
  if(pdfBtn) pdfBtn.style.display = (expandedFamilyRootId && people[expandedFamilyRootId]) ? 'inline-flex' : 'none';
}
function fitViewToGeneration(g){
  const ids = Object.keys(people).filter(id=>lastLayout.gen[id]===g);
  if(!ids.length) return;
  let minX=Infinity,maxX=-Infinity;
  ids.forEach(id=>{
    const fp = overrides[id] || lastLayout.pos[id]; if(!fp) return;
    minX=Math.min(minX,fp.x); maxX=Math.max(maxX,fp.x+CARD_W);
  });
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const w = maxX-minX+160;
  scale = Math.min(1.3, rect.width/w);
  tx = -minX*scale + 80;
  ty = -(g*ROW_H)*scale + rect.height/2 - (CARD_H*scale)/2;
  applyTransform();
}

function genderLabel(g){ return g==='male'?'Masculino':g==='female'?'Feminino':'Outro'; }
function getRelationLabels(p){
  const nameOf = id => people[id]?.name || '';
  const myParentSet = new Set([...(p.parentIds||[]), ...(p.adoptiveParentIds||[])]);
  const siblings = myParentSet.size ? Object.values(people).filter(x=>{
    if(x.id===p.id) return false;
    const xParents = [...(x.parentIds||[]), ...(x.adoptiveParentIds||[])];
    return xParents.some(pid=>myParentSet.has(pid));
  }).map(x=>x.name) : [];
  const children = Object.values(people).filter(x=>(x.parentIds||[]).includes(p.id) || (x.adoptiveParentIds||[]).includes(p.id)).map(x=>x.name);
  return {
    parents: [...(p.parentIds||[]), ...(p.adoptiveParentIds||[])].map(nameOf).filter(Boolean).join(', '),
    siblings: siblings.filter(Boolean).join(', '),
    spouses: [...(p.spouseIds||[]), ...(p.exSpouseIds||[])].map(nameOf).filter(Boolean).join(', '),
    children: children.filter(Boolean).join(', ')
  };
}
function openReportModal(){

    const d = parseDateValue(p.birth);
    const rel = getRelationLabels(p);

    if(a.ts===null && b.ts===null) return a.name.localeCompare(b.name);

      p.gender = newGender;
      p.birth = newBirth;
      p.death = newDeath;
    });

    persist();

function exportReportPdf(list){

    {label:'Cônjuge', key:'spouses', w:100},

  ];

    pdf.setFillColor(250,246,236);
    pdf.rect(0,0,pageW,pageH,'F');
    pdf.setFontSize(15);
    pdf.setTextColor(36,31,20);

    pdf.setDrawColor(198,155,74);

  }

  list.forEach(p=>{

      name: p.name, gender: p.gender, birth: p.birth||'—', death: p.death||'—', genLabel: 'Ger. '+(p.gen+1),
      parents: p.parents||'—', siblings: p.siblings||'—', spouses: p.spouses||'—', children: p.children||'—'
    };
    const wrapped = {};

    cols.forEach(c=>{
      const lines = pdf.splitTextToSize(String(values[c.key]), c.w-6);
      wrapped[c.key] = lines;
      maxLines = Math.max(maxLines, lines.length);
    });
    const rowH = maxLines*10 + 6;

/* ============================= STATIC TREE SNAPSHOT (for PDF) ============================= */
function renderTreeSnapshot(subset, titleText, halfSet){
  halfSet = halfSet || new Set();
  const { pos, genList } = layoutTree(subset);
  let maxX=0, maxY=0;
  Object.values(pos).forEach(p=>{ maxX=Math.max(maxX,p.x+CARD_W); maxY=Math.max(maxY,p.y+CARD_H); });

  const wrapper = document.createElement('div');
  wrapper.style.cssText = `position:fixed;left:0;top:0;opacity:1;pointer-events:none;z-index:-9999;background:#faf6ec;padding:40px;width:${maxX+120}px;box-sizing:content-box;font-family:Inter,sans-serif;`;

  const header = document.createElement('div');
  header.style.cssText = 'margin-bottom:24px;';
  header.innerHTML = `
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a6f3b;">Livro de família</div>
    <div style="font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:#241f14;">${escapeHtml(titleText)}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6047;margin-top:2px;">${Object.keys(subset).length} pessoas · ${genList.length} gerações · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
    ${halfSet.size ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#a15a3d;margin-top:6px;">* Filho(a) de outro relacionamento — sem vínculo sanguíneo com os avós desta árvore.</div>` : ''}
  `;
  wrapper.appendChild(header);

  const canvasArea = document.createElement('div');
  canvasArea.style.cssText = `position:relative;width:${maxX+80}px;height:${maxY+80}px;`;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', maxX+80);
  svg.setAttribute('height', maxY+80);
  svg.style.cssText = 'position:absolute;top:0;left:0;overflow:visible;';
  canvasArea.appendChild(svg);

  const nodesLayer = document.createElement('div');
  nodesLayer.style.cssText = 'position:absolute;top:0;left:0;';
  canvasArea.appendChild(nodesLayer);

  // gen labels
  genList.forEach(g=>{
    const lbl = document.createElement('div');
    lbl.style.cssText = `position:absolute;left:0;top:${g*ROW_H+CARD_H/2-8}px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a6f3b;border-left:2px solid #8a6f3b;padding-left:8px;`;
    lbl.textContent = 'Geração ' + (g+1);
    nodesLayer.appendChild(lbl);
  });

  // spouse/ex ties
  const drawnPairs = new Set();
  Object.values(subset).forEach(p=>{
    (p.spouseIds||[]).forEach(sid=>{
      if(!subset[sid]) return;
      const key=[p.id,sid].sort().join('|'); if(drawnPairs.has(key)) return; drawnPairs.add(key);
      drawTie(svg, pos[p.id], pos[sid], false);
    });
    (p.exSpouseIds||[]).forEach(sid=>{
      if(!subset[sid]) return;
      const key='ex|'+[p.id,sid].sort().join('|'); if(drawnPairs.has(key)) return; drawnPairs.add(key);
      drawTie(svg, pos[p.id], pos[sid], true);
    });
  });
  // parent-child links
  Object.values(subset).forEach(child=>{
    const bio = (child.parentIds||[]).filter(id=>subset[id] && pos[id]);
    if(bio.length) drawParentChildLink(svg, pos, bio, child.id, false);
    const ado = (child.adoptiveParentIds||[]).filter(id=>subset[id] && pos[id]);
    if(ado.length) drawParentChildLink(svg, pos, ado, child.id, true);
  });
  // cards
  Object.values(subset).forEach(p=>{
    const fp = pos[p.id]; if(!fp) return;
    const isHalf = halfSet.has(p.id);
    const card = document.createElement('div');
    card.style.cssText = `position:absolute;left:${fp.x}px;top:${fp.y}px;width:${CARD_W}px;min-height:82px;background:linear-gradient(180deg,#efe7d3,#e4d9bb);border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.15)${isHalf?', 0 0 0 2px #a15a3d':''};padding:10px 12px 9px;`;
    card.innerHTML = `
      ${p.photo?`<img src="${p.photo}" style="position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #faf6ec;box-shadow:0 2px 5px rgba(0,0,0,.3);">`:''}
      <div style="position:absolute;top:0;left:8px;right:8px;height:3px;border-radius:0 0 3px 3px;background:${genderColorHex(p.gender)};"></div>
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:${nameFontSize}px;color:${nameColorHex||'#2a2313'};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.name||'(sem nome)')}${isHalf?' <span style="color:#a15a3d;">*</span>':''}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6b6047;margin-top:4px;">${fullDates(p)}</div>
      ${(p.adoptiveParentIds&&p.adoptiveParentIds.length)?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#2f5850;margin-top:3px;text-transform:uppercase;">🌱 adotivo(a)</div>`:''}
    `;
    nodesLayer.appendChild(card);
  });

  wrapper.appendChild(canvasArea);
  document.body.appendChild(wrapper);
  return wrapper;
}

function safeCanvasScale(widthPx, heightPx, desired){
  desired = desired || 2;
  const MAX_DIM = 8000;
  const MAX_AREA = 30000000;
  let scale = desired;
  while(scale > 1 && (widthPx*scale > MAX_DIM || heightPx*scale > MAX_DIM || widthPx*heightPx*scale*scale > MAX_AREA)){
    scale -= 0.25;
  }
  return Math.max(1, Math.round(scale*4)/4);
}
function waitForImages(container){
  const imgs = Array.from(container.querySelectorAll('img'));
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(res=>{ img.onload = res; img.onerror = res; });
  }));
}
const PAGE_SIZES = { a0:'a0', a1:'a1', a2:'a2', a3:'a3', a4:'a4' };
const SPLIT_PDF_THRESHOLD = 40; // people above this count get split into multiple pages automatically
async function generatePdf(rootId, mode, pageSize){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    showToast('Bibliotecas de PDF não carregaram. Verifique sua conexão.'); return;
  }
  mode = mode || 'descendants';
  pageSize = (pageSize || 'a4').toLowerCase();
  if(!PAGE_SIZES[pageSize]) pageSize = 'a4';
  let subset, halfSet = new Set(), titleText = 'Árvore Genealógica Completa';
  if(rootId){
    const root = people[rootId];
    if(mode==='ancestors'){
      subset = buildAncestorFamilySubset(rootId);
      titleText = `Ascendência de ${root.name}`;
    } else {
      const result = buildDescendantFamilySubset(rootId);
      subset = result.subset; halfSet = result.halfSet;
      const spouseNames = (root.spouseIds||[]).concat(root.exSpouseIds||[]).map(id=>people[id]?.name).filter(Boolean);
      titleText = `Descendência de ${root.name}` + (spouseNames.length ? ` & ${spouseNames.join(', ')}` : '');
    }
  } else {
    subset = people;
  }
  const peopleCount = Object.keys(subset).length;
  if(peopleCount===0){ showToast('Nada para exportar.'); return; }

  // large trees don't fit safely on a single page: split into one page per family, always
  // keeping the main person/couple's name visible on every page for context.
  if(peopleCount > SPLIT_PDF_THRESHOLD){
    const units = sortFamilyUnitsByGeneration(getFamilyUnitsForSubset(subset), computeGenerations(subset));
    if(units.length > 1){
      showToast(`Árvore grande (${peopleCount} pessoas) — gerando em ${units.length} partes…`);
      const prefix = mode==='ancestors' ? 'ascendencia' : (rootId ? 'descendencia' : 'arvore-genealogica-completa');
      const filename = (rootId ? `${prefix}-${people[rootId].name}` : prefix).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-partes.pdf';
      await renderFamilyUnitsToPdf(units, {
        pageSize,
        coverTitle: titleText,
        coverSubtitle: `${peopleCount} pessoas · dividida em ${units.length} partes · gerado em ${new Date().toLocaleDateString('pt-BR')}`,
        headerNote: titleText,
        filename
      });
      return;
    }
    // fall through to the single-page path if, for some reason, everyone landed in one unit
  }

  showToast('Gerando PDF…');
  let wrapper;
  try{
    wrapper = renderTreeSnapshot(subset, titleText, halfSet);
    // let the layout paint, then wait for every photo to actually finish loading before snapshotting
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    await waitForImages(wrapper);
    const scale = safeCanvasScale(wrapper.scrollWidth, wrapper.scrollHeight, 2);
    const canvas = await html2canvas(wrapper, {
      backgroundColor:'#faf6ec', scale, useCORS:true,
      width: wrapper.scrollWidth, height: wrapper.scrollHeight,
      windowWidth: wrapper.scrollWidth, windowHeight: wrapper.scrollHeight
    });
    const w = canvas.width/scale, h = canvas.height/scale;
    // large trees default to landscape to fit the most people possible per page
    const orientation = (peopleCount > 10 || w >= h*0.75) ? 'landscape' : 'portrait';
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation, unit:'pt', format: pageSize });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 30;
    const availW = pageW - margin*2, availH = pageH - margin*2;
    const fitScale = Math.min(availW/w, availH/h, 3);
    const drawW = w*fitScale, drawH = h*fitScale;
    const x = (pageW-drawW)/2, y = (pageH-drawH)/2;
    pdf.setFillColor(250,246,236);
    pdf.rect(0,0,pageW,pageH,'F');
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, drawW, drawH);
    const prefix = mode==='ancestors' ? 'ascendencia' : (rootId ? 'descendencia' : 'arvore-genealogica-completa');
    const filename = (rootId ? `${prefix}-${people[rootId].name}` : prefix).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '.pdf';
    pdf.save(filename);
    showToast('PDF salvo com sucesso.');
  }catch(err){
    console.error(err);
    showToast('Erro ao gerar PDF. Tente reduzir o tamanho da página ou da árvore selecionada.');
  }finally{
    if(wrapper && wrapper.parentNode) document.body.removeChild(wrapper);
  }
}
document.getElementById('btn-export-pdf').onclick = ()=>{
